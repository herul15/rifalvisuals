name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/rifalvisuals_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit -- --reporter=default --reporter=junit --outputFile=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  integration-e2e:
    name: PostgreSQL, build and browser tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rifalvisuals_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rifalvisuals_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/rifalvisuals_app
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/rifalvisuals_ci_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Generate ephemeral session key
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const key = randomBytes(48).toString('hex');
          appendFileSync(process.env.GITHUB_ENV, `TEST_JWT_SECRET=${key}\nJWT_SECRET=${key}\n`);
          NODE
      - run: npm run test:db:setup
      - run: npm run test:integration -- --reporter=default --reporter=junit --outputFile=reports/integration.xml
      - name: Build production application
        shell: bash
        run: |
          mkdir -p reports
          npm run build 2>&1 | tee reports/build.log
      - run: npx playwright install --with-deps chromium
      - name: Restore browser fixtures
        run: npm run test:db:setup
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-and-browser-results
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
